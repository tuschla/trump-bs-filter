[feed]
url = "https://trumpstruth.org/feed"
poll_interval_secs = 300
# source = "truthsocial" polls Truth Social's API directly (near-zero mirror lag,
# real post times) instead of the trumpstruth.org RSS mirror. Anything else uses
# the RSS feed at `url`.
# source = "truthsocial"
# truthsocial_account_id = "107780257626128497"  # realDonaldTrump
# Only ingest posts strictly newer than this RFC3339 instant. Set to the newest
# post already in the DB when switching sources so nothing double-publishes under
# the new id scheme.
# cutover_rfc3339 = "2026-07-26T13:46:25Z"

[storage]
db_path = "/data/truths.db"

[prompts]
dir = "prompts"
# Leave empty to run all pipelines found in prompts dir.
# Or specify which ones to run:
# active = ["nvc_mister_rogers", "therapist", "five_year_old", "no_bs"]

# Optional: uncomment and fill in to publish
# [publishers.mastodon]
# instance_url = "https://mastodon.social"
# access_token = "your-token-here"

# [publishers.bluesky]
# handle = "your-handle.bsky.social"
# password = "your-app-password"
